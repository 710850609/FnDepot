name: Daily Update Repo List

on:
  schedule:
    # 每天每 3 小时执行一次
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  update-repo-list:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 确保存在执行脚本
        run: chmod +x fetch_source.sh

      - name: 执行脚本
        run: ./fetch_source.sh

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo_list.txt

          # 检查是否有修改
          if git status --porcelain | grep -q .; then          
            echo "repo_list.txt修改内容:"
            git diff repo_list.txt
            git commit -m "Update repo list"
            git push origin HEAD:main
            echo "提交并推送变更repo_list.txt"
          else
            echo "没有变更repo_list.txt，跳过推送"
          fi
